<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chat Client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ========== 登录界面 ========== -->
  <div id="login-view" class="view">
    <div class="login-card">
      <h2 id="login-title">正在连接服务器...</h2>
      <div id="avatar-selector" class="avatar-selector" style="display: none;">
        <div class="avatar-preview" id="avatar-preview">
          <svg class="avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
          </svg>
          <div class="avatar-overlay">选择头像</div>
        </div>
        <input type="file" id="avatar-input" accept="image/*" style="display:none">
      </div>
      <input type="text" id="username" placeholder="请输入用户名" disabled>
      <input type="password" id="password" placeholder="请输入密码" disabled>
      <button id="login-btn" disabled>确认</button>
      <a href="#" id="switch-mode">没有账号? 去注册</a>
    </div>
  </div>

  <!-- ========== 聊天界面 ========== -->
  <div id="chat-view" class="view" style="display: none;">
    <div class="sidebar">
      <div class="sidebar-header"><span id="user-info"></span></div>
      <div class="sidebar-toolbar">
        <button class="toolbar-btn" id="btn-add-friend" title="添加好友">＋友</button>
        <button class="toolbar-btn" id="btn-add-group" title="加入群组">＋群</button>
        <button class="toolbar-btn" id="btn-create-group" title="创建群组">建群</button>
        <div style="flex:1"></div>
        <button class="toolbar-btn" id="btn-exit" title="退出">退出</button>
      </div>
      <ul id="contact-list"></ul>
    </div>
    <div class="chat-main">
      <div class="chat-header" id="chat-header">选择一个联系人开始聊天</div>
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <textarea id="msg-input" placeholder="输入消息..." rows="2"></textarea>
        <button id="send-btn">发送</button>
      </div>
    </div>
  </div>

  <!-- ========== 弹窗（添加好友/加入群组/创建群组）========== -->
  <div id="dialog-overlay" style="display: none;">
    <div class="dialog-card">
      <div class="dialog-top">
        <h3 id="dialog-title">添加好友</h3>
        <button id="dialog-close" class="dialog-close-btn">×</button>
      </div>
      <div id="dialog-error" class="dialog-error"></div>
      <input type="text" id="dialog-input" placeholder="">
      <button id="dialog-confirm" class="dialog-confirm-btn">确定</button>
    </div>
  </div>

  <!-- ========== 右键菜单 ========== -->
  <div id="context-menu" style="display: none;">
    <div class="ctx-item" id="ctx-remove">删除好友</div>
  </div>

  <script src="./tcp.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
